[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "technical-state-scanner"
version = "0.1.0"
description = "LongPort multi-signal multi-timeframe technical state scanner"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "longport>=2.1.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "pytz>=2024.1",
  "pyarrow>=14.0.0",
  "scipy>=1.10.0",
  "duckdb>=0.10.0",
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "websockets>=12.0",
]

[project.scripts]
tech-state-validate-env = "technical_state_scanner.cli:main"
tech-state-server = "technical_state_scanner.api.app:run_server"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
