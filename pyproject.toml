[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "technical-state-scanner"
version = "0.1.0"
description = "LongPort multi-signal multi-timeframe technical state scanner"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "longport>=2.1.0",
  "finplot>=1.9.7",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "pyarrow>=14.0.0",
  "PyQt6>=6.6.0",
  "pyqtgraph>=0.13.0",
  "scipy>=1.10.0",
  "streamlit>=1.30.0"
]

[project.scripts]
tech-state-validate-env = "technical_state_scanner.cli:main"
tech-state-gui = "technical_state_scanner.gui.app:run_app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
